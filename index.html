<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestion ETS Ibrahim Hamissou (IH) — Achats · Ventes · Facturation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#16202b;
  --slate:#2c3e50;
  --slate-light:#3f5468;
  --paper:#f5f3ee;
  --panel:#ffffff;
  --line:#e2ddd1;
  --gold:#b9852f;
  --gold-dark:#8f6720;
  --green:#3c7a52;
  --red:#b0433a;
  --muted:#6b7684;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{height:100%;}
body{
  font-family:'Inter',sans-serif;
  background:var(--paper);
  color:var(--ink);
  -webkit-font-smoothing:antialiased;
}
h1,h2,h3,.brand,.numero-tag{font-family:'Space Grotesk',sans-serif;}
.mono{font-family:'IBM Plex Mono',monospace;}

#app{display:flex;min-height:100vh;}

/* ---------- SIDEBAR ---------- */
#sidebar{
  width:230px;flex-shrink:0;background:var(--slate);
  color:#e7ebee;display:flex;flex-direction:column;
  position:sticky;top:0;height:100vh;
}
.brand{
  padding:24px 20px 18px;font-size:19px;font-weight:700;
  letter-spacing:0.2px;border-bottom:1px solid rgba(255,255,255,0.08);
  display:flex;flex-direction:column;gap:2px;
}
.brand span{font-family:'Inter';font-size:11px;font-weight:500;color:var(--gold);letter-spacing:1.5px;text-transform:uppercase;}
nav{padding:14px 10px;flex:1;}
.nav-btn{
  width:100%;text-align:left;background:none;border:none;color:#c7d0d8;
  padding:11px 14px;border-radius:8px;font-size:14px;font-weight:500;
  cursor:pointer;display:flex;align-items:center;gap:10px;margin-bottom:2px;
  transition:background .15s, color .15s;
}
.nav-btn:hover{background:rgba(255,255,255,0.06);color:#fff;}
.nav-btn.active{background:var(--gold);color:#1c1300;font-weight:600;}
.nav-btn .ic{width:18px;text-align:center;font-size:15px;}
.sidebar-foot{padding:14px 18px;font-size:11px;color:#8695a3;border-top:1px solid rgba(255,255,255,0.08);}

/* ---------- MAIN ---------- */
#main{flex:1;padding:32px 40px;max-width:1180px;}
.topbar{display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:26px;flex-wrap:wrap;gap:12px;}
.topbar h1{font-size:24px;font-weight:700;}
.topbar p{color:var(--muted);font-size:13.5px;margin-top:2px;}
.btn{
  border:none;border-radius:8px;padding:10px 18px;font-size:13.5px;font-weight:600;
  cursor:pointer;font-family:'Inter';transition:transform .1s, opacity .15s;display:inline-flex;align-items:center;gap:7px;
}
.btn:active{transform:scale(0.97);}
.btn-primary{background:var(--gold);color:#1c1300;}
.btn-primary:hover{background:var(--gold-dark);}
.btn-outline{background:transparent;border:1px solid var(--line);color:var(--slate);}
.btn-outline:hover{border-color:var(--slate);}
.btn-danger{background:#fdeeec;color:var(--red);}
.btn-danger:hover{background:#f9dcd8;}
.btn-sm{padding:6px 12px;font-size:12.5px;border-radius:6px;}

/* cards / stats */
.grid-stats{display:grid;grid-template-columns:repeat(4,1fr);gap:16px;margin-bottom:28px;}
.stat-card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px 20px;}
.stat-card .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600;margin-bottom:8px;}
.stat-card .val{font-size:24px;font-weight:700;font-family:'Space Grotesk';}
.stat-card .sub{font-size:12px;color:var(--muted);margin-top:4px;}
.stat-card.alert .val{color:var(--red);}
.stat-card.good .val{color:var(--green);}

.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px 24px;margin-bottom:22px;}
.panel h3{font-size:15px;margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}

table{width:100%;border-collapse:collapse;font-size:13.5px;}
thead th{
  text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.5px;
  color:var(--muted);font-weight:600;padding:0 10px 10px;border-bottom:1px solid var(--line);
}
tbody td{padding:11px 10px;border-bottom:1px solid #f0ede4;}
tbody tr:hover{background:#faf8f3;}
tbody tr:last-child td{border-bottom:none;}
.right{text-align:right;}
.center{text-align:center;}
.tag{display:inline-block;padding:3px 9px;border-radius:20px;font-size:11px;font-weight:600;}
.tag-client{background:#e8f0ea;color:var(--green);}
.tag-fournisseur{background:#fdf1e3;color:var(--gold-dark);}
.tag-low{background:#fdeeec;color:var(--red);}
.tag-ok{background:#e8f0ea;color:var(--green);}
.empty{padding:30px 10px;text-align:center;color:var(--muted);font-size:13.5px;}

/* ventes: onglets vue */
.view-toggle{display:flex;gap:4px;background:#e9e5d8;padding:4px;border-radius:9px;width:fit-content;margin-bottom:18px;}
.view-toggle button{border:none;background:transparent;padding:8px 16px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--slate-light);cursor:pointer;font-family:'Inter';}
.view-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}

/* historique par client */
.client-group{background:var(--panel);border:1px solid var(--line);border-radius:12px;margin-bottom:12px;overflow:hidden;}
.client-group summary{
  list-style:none;cursor:pointer;padding:16px 20px;display:flex;align-items:center;justify-content:space-between;gap:14px;
}
.client-group summary::-webkit-details-marker{display:none;}
.client-group summary::before{content:"▸";color:var(--muted);font-size:12px;margin-right:10px;transition:transform .15s;}
.client-group[open] summary::before{transform:rotate(90deg);}
.cg-left{display:flex;align-items:center;gap:12px;}
.cg-avatar{
  width:34px;height:34px;border-radius:50%;background:var(--slate);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:12.5px;flex-shrink:0;
}
.cg-name{font-size:14.5px;font-weight:700;}
.cg-sub{font-size:12px;color:var(--muted);margin-top:2px;}
.cg-total{font-size:15px;font-weight:700;font-family:'Space Grotesk';color:var(--gold-dark);white-space:nowrap;}
.cg-table{width:100%;border-collapse:collapse;font-size:13px;border-top:1px solid var(--line);}
.cg-table thead th{
  text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:600;
  padding:10px 20px 8px;background:#faf8f3;
}
.cg-table td{padding:10px 20px;border-bottom:1px solid #f0ede4;}
.cg-table tbody tr:last-child td{border-bottom:none;}
.cg-table tbody tr:hover{background:#faf8f3;}

/* modal */
.overlay{position:fixed;inset:0;background:rgba(22,32,43,0.45);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
.overlay.open{display:flex;}
.modal{background:#fff;border-radius:14px;width:100%;max-width:560px;max-height:88vh;overflow:auto;padding:26px 28px;}
.modal.wide{max-width:760px;}
.modal h3{font-size:17px;margin-bottom:18px;}
.field{margin-bottom:14px;}
.field label{display:block;font-size:12px;font-weight:600;color:var(--slate-light);margin-bottom:6px;}
.field input, .field select{
  width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:7px;font-size:13.5px;font-family:'Inter';
}
.field input:focus, .field select:focus{outline:none;border-color:var(--gold);}
.field-row{display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:18px;}

/* lines editor (achats/ventes) */
.lines-box{border:1px solid var(--line);border-radius:9px;padding:12px;margin-bottom:14px;}
.prod-search-wrap{position:relative;margin-bottom:12px;}
.prod-search-wrap input{
  width:100%;padding:10px 12px 10px 34px;border:1px solid var(--line);border-radius:8px;
  font-size:13.5px;font-family:'Inter';background:#fff url('data:image/svg+xml;utf8,<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="%236b7684" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>') no-repeat 10px center;
}
.prod-search-wrap input:focus{outline:none;border-color:var(--gold);}
.prod-search-results{
  position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid var(--line);
  border-radius:9px;box-shadow:0 10px 26px rgba(22,32,43,.14);max-height:230px;overflow-y:auto;z-index:20;
}
.prod-search-item{
  display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 12px;
  cursor:pointer;font-size:13px;border-bottom:1px solid #f0ede4;
}
.prod-search-item:last-child{border-bottom:none;}
.prod-search-item:hover{background:#faf8f3;}
.prod-search-item .psi-name{font-weight:600;color:var(--ink);}
.prod-search-item .psi-meta{font-size:11.5px;color:var(--muted);}
.prod-search-item .psi-price{font-size:12.5px;color:var(--gold-dark);font-weight:600;white-space:nowrap;}
.prod-search-empty{padding:12px;font-size:12.5px;color:var(--muted);text-align:center;}
.line-row{display:grid;grid-template-columns:2.2fr 0.8fr 1fr 1fr auto;gap:8px;align-items:center;margin-bottom:8px;}
.line-row select, .line-row input{padding:7px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;}
.line-remove{background:none;border:none;color:var(--red);cursor:pointer;font-size:15px;}
.lines-total{display:flex;justify-content:space-between;padding-top:10px;border-top:1px solid var(--line);font-weight:700;font-size:14.5px;}

/* toast */
#toast{position:fixed;bottom:22px;right:22px;background:var(--slate);color:#fff;padding:12px 18px;border-radius:9px;font-size:13.5px;box-shadow:0 8px 24px rgba(0,0,0,.2);opacity:0;transform:translateY(8px);transition:all .25s;pointer-events:none;z-index:100;}
#toast.show{opacity:1;transform:translateY(0);}

/* ---------- FACTURE / PRINT ---------- */
#factureView{background:#fff;border:1px solid var(--line);border-radius:12px;padding:0;overflow:hidden;}
.fac-head{background:var(--slate);color:#fff;padding:26px 30px;display:flex;justify-content:space-between;align-items:flex-start;}
.fac-head .co-name{font-family:'Space Grotesk';font-size:19px;font-weight:700;}
.fac-head .co-sub{font-size:12px;color:#c7d0d8;margin-top:4px;line-height:1.5;}
.fac-head .fac-id{text-align:right;}
.fac-head .fac-id .num{font-family:'IBM Plex Mono';font-size:15px;color:var(--gold);font-weight:600;}
.fac-head .fac-id .date{font-size:12px;color:#c7d0d8;margin-top:4px;}
.fac-body{padding:26px 30px;}
.fac-parties{display:flex;justify-content:space-between;margin-bottom:22px;gap:20px;}
.fac-parties .blk{font-size:12.5px;line-height:1.6;}
.fac-parties .blk .lbl{font-size:10.5px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:4px;}
.fac-table{width:100%;border-collapse:collapse;font-size:13px;margin-bottom:18px;}
.fac-table thead th{background:#f5f3ee;padding:9px 10px;text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--slate-light);}
.fac-table td{padding:9px 10px;border-bottom:1px solid #eee;}
.fac-totals{margin-left:auto;width:300px;font-size:13.5px;}
.fac-totals div{display:flex;justify-content:space-between;align-items:center;padding:6px 0;}
.fac-totals .grand{font-weight:700;font-size:16px;border-top:2px solid var(--ink);margin-top:4px;padding-top:10px;}
.fac-totals .paye-row input{width:120px;padding:6px 9px;border:1px solid var(--line);border-radius:6px;font-size:13px;text-align:right;font-family:'IBM Plex Mono';}
.fac-totals .paye-row input:focus{outline:none;border-color:var(--gold);}
.fac-totals .reste-row{border-top:1px dashed var(--line);margin-top:2px;padding-top:10px;font-weight:700;}
.fac-totals .reste-row.ok{color:var(--green);}
.fac-totals .reste-row.due{color:var(--red);}
.print-only{display:none;}
.fac-foot{padding:18px 30px;border-top:1px dashed var(--line);font-size:11.5px;color:var(--muted);text-align:center;}
.fac-signatures{display:flex;justify-content:space-between;gap:30px;padding:34px 30px 6px;}
.fac-signatures .sig-block{flex:1;text-align:center;}
.fac-signatures .sig-line{border-bottom:1px solid var(--ink);height:56px;margin-bottom:8px;}
.fac-signatures .sig-label{font-size:11.5px;font-weight:600;color:var(--slate-light);text-transform:uppercase;letter-spacing:.5px;}
.fac-actions{padding:16px 30px;display:flex;gap:10px;justify-content:flex-end;background:#faf8f3;}

/* format switch (A4 vs ticket) */
.format-bar{display:flex;align-items:center;justify-content:space-between;gap:14px;margin-bottom:16px;flex-wrap:wrap;}
.format-toggle{display:flex;gap:4px;background:#e9e5d8;padding:4px;border-radius:9px;}
.format-toggle button{border:none;background:transparent;padding:8px 16px;border-radius:7px;font-size:12.5px;font-weight:600;color:var(--slate-light);cursor:pointer;font-family:'Inter';}
.format-toggle button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.12);}
.format-bar select{padding:8px 11px;border:1px solid var(--line);border-radius:8px;font-size:12.5px;background:#fff;}

/* ---------- TICKET (imprimante thermique) ---------- */
.ticket-preview-bg{background:#e5e1d3;padding:26px 10px;display:flex;justify-content:center;border-radius:12px;}
.ticket{
  width:80mm;background:#fff;padding:5mm 4mm;color:#000;
  font-family:'IBM Plex Mono',monospace;font-size:11.5px;line-height:1.55;
  box-shadow:0 4px 16px rgba(0,0,0,.12);
}
.ticket.w58{width:58mm;font-size:10px;}
.ticket-center{text-align:center;}
.ticket-bold{font-weight:700;}
.ticket-sep{border-top:1px dashed #000;margin:8px 0;}
.ticket-row{display:flex;justify-content:space-between;gap:6px;}
.ticket-item{margin-bottom:5px;}
.ticket-item .nom{font-weight:600;}
.ticket-item .sub{display:flex;justify-content:space-between;color:#222;}
.ticket-totals div{display:flex;justify-content:space-between;padding:2px 0;}
.ticket-totals .grand{font-weight:700;border-top:1px dashed #000;margin-top:4px;padding-top:6px;}
.ticket-totals .paye-row select,.ticket-totals .paye-row input{width:90px;font-family:'IBM Plex Mono';font-size:11px;text-align:right;border:1px solid var(--line);border-radius:5px;padding:3px 6px;}
.ticket-sign{margin-top:16px;}
.ticket-sign div{margin-bottom:12px;}
.ticket-sign .sig-line-t{border-bottom:1px dashed #000;height:28px;margin-bottom:3px;}
.ticket-foot{text-align:center;margin-top:12px;font-size:10px;}

@media print{
  body *{visibility:hidden;}
  #factureView, #factureView *{visibility:visible;}
  #factureView{position:absolute;top:0;left:0;width:100%;border:none;border-radius:0;}
  body.print-ticket #factureView{width:auto;}
  body.print-ticket .ticket-preview-bg{background:none;padding:0;display:block;border-radius:0;}
  body.print-ticket .ticket{box-shadow:none;padding:2mm 3mm;}
  .fac-actions,.format-bar{display:none;}
  .screen-only{display:none !important;}
  .print-only{display:flex !important;}
  #sidebar,.topbar,.overlay,#toast,#virtualKeyboard,.preview-overlay{display:none !important;}
}
.hidden{display:none !important;}

/* ---------- CLAVIER VISUEL ---------- */
#virtualKeyboard{
  position:fixed;top:0;left:0;bottom:0;z-index:300;
  width:325px;
  background:var(--slate);padding:18px 12px calc(18px + env(safe-area-inset-bottom));
  box-shadow:8px 0 28px rgba(0,0,0,.24);
  transform:translateX(-105%);transition:transform .22s ease;
  border-radius:0 16px 16px 0;
  display:flex;flex-direction:column;justify-content:center;
  overflow-y:auto;
}
#virtualKeyboard.open{transform:translateX(0);}
.vk-topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
.vk-topbar span{color:#c7d0d8;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.6px;}
.vk-close{background:none;border:none;color:#c7d0d8;font-size:12.5px;cursor:pointer;font-weight:600;padding:4px 6px;}
.vk-close:hover{color:#fff;}
.vk-row{display:flex;gap:4px;margin-bottom:5px;}
.vk-key{
  flex:1;min-width:0;background:#3f5468;color:#f2f4f6;border:none;border-radius:7px;
  padding:10px 0;font-size:12px;font-weight:600;cursor:pointer;user-select:none;
  font-family:'Inter';transition:background .1s;
}
.vk-key:active{background:var(--gold);color:#1c1300;}
.vk-key.wide{flex:1.6;font-size:10px;padding:10px 2px;}
.vk-key.space{flex:3.4;}
.vk-key.special{background:#24313e;}
.vk-key.shift-active{background:var(--gold);color:#1c1300;}

/* ---------- À PROPOS ---------- */
.about-hero{
  background:var(--slate);color:#fff;border-radius:14px;padding:32px 30px;
  display:flex;align-items:center;gap:20px;margin-bottom:20px;
}
.about-hero .logo{
  width:64px;height:64px;border-radius:16px;background:var(--gold);color:#1c1300;
  display:flex;align-items:center;justify-content:center;font-size:26px;font-weight:700;
  font-family:'Space Grotesk';flex-shrink:0;
}
.about-hero h2{font-size:20px;font-weight:700;}
.about-hero .ver{font-size:12.5px;color:#c7d0d8;margin-top:4px;}
.about-hero .ver span{background:rgba(255,255,255,0.12);padding:2px 9px;border-radius:20px;font-family:'IBM Plex Mono';margin-left:2px;}
.about-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.about-card .lbl{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:700;margin-bottom:10px;}
.dev-row{display:flex;align-items:center;gap:12px;margin-bottom:16px;}
.dev-row .av{
  width:44px;height:44px;border-radius:50%;background:var(--slate);color:var(--gold);
  display:flex;align-items:center;justify-content:center;font-weight:700;font-size:15px;flex-shrink:0;
}
.dev-row .dn{font-size:14.5px;font-weight:700;}
.dev-row .dr{font-size:12px;color:var(--muted);margin-top:2px;}
.contact-line{display:flex;align-items:center;gap:10px;font-size:13.5px;padding:9px 0;border-bottom:1px solid #f0ede4;}
.contact-line:last-child{border-bottom:none;}
.contact-line .ci{width:26px;height:26px;border-radius:7px;background:#fdf1e3;color:var(--gold-dark);display:flex;align-items:center;justify-content:center;font-size:13px;flex-shrink:0;}
.contact-line a{color:var(--ink);text-decoration:none;font-weight:600;}
.contact-line a:hover{color:var(--gold-dark);text-decoration:underline;}
@media (max-width:820px){
  .about-grid{grid-template-columns:1fr;}
  .about-hero{flex-direction:column;text-align:center;}
}

/* ---------- MISES À JOUR ---------- */
.maj-badge{
  display:inline-flex;align-items:center;gap:6px;background:rgba(60,122,82,0.15);color:#dff2e6;
  padding:4px 12px;border-radius:20px;font-size:11.5px;font-weight:700;margin-top:8px;
}
.maj-safety{
  display:flex;gap:14px;align-items:flex-start;background:#eef5ef;border:1px solid #d3e8d8;
  border-radius:12px;padding:16px 18px;margin-bottom:20px;
}
.maj-safety .ic{font-size:20px;flex-shrink:0;}
.maj-safety h4{font-size:14px;color:var(--green);margin-bottom:4px;}
.maj-safety p{font-size:12.5px;color:var(--slate-light);line-height:1.6;}
.version-entry{border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-bottom:14px;background:var(--panel);}
.version-entry.current{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold);}
.version-entry .v-head{display:flex;align-items:center;gap:10px;margin-bottom:10px;flex-wrap:wrap;}
.version-entry .v-num{font-family:'Space Grotesk';font-size:15.5px;font-weight:700;}
.version-entry .v-date{font-size:12px;color:var(--muted);}
.version-entry ul{margin:0;padding-left:18px;}
.version-entry li{font-size:13px;color:var(--slate-light);margin-bottom:5px;line-height:1.5;}
.tag-maj{background:#fdf1e3;color:var(--gold-dark);}

/* dossier de sauvegarde */
.folder-box{
  display:flex;align-items:center;gap:12px;background:#faf8f3;border:1px solid var(--line);
  border-radius:10px;padding:12px 14px;
}
.folder-ic{font-size:22px;flex-shrink:0;}
.folder-name{font-size:13.5px;font-weight:700;color:var(--ink);}
.folder-sub{font-size:11.5px;color:var(--muted);margin-top:2px;}

/* ---------- format A5 / A4 double (échelle réduite) ---------- */
.fac-scaled .fac-head{padding:14px 16px;}
.fac-scaled .co-name{font-size:14px;}

<script>
/* ============================================================
   GESTION COMMERCIALE — application autonome (IndexedDB)
   ============================================================ */

const APP_VERSION = "1.1.0";
const UPDATE_HISTORY = [
  {
    version: "1.1.0",
    date: "2026-08-22",
    changes: [
      "Ajout de la connexion sécurisée (compte administrateur, mot de passe protégé)",
      "Facture disponible en format A4 et en ticket thermique (58mm / 80mm)",
      "Ajout du montant payé et du montant à restituer sur la facture",
      "Zones de signature client et vendeur sur la facture",
      "Barre de recherche de produit dans le formulaire de vente",
      "Historique des ventes regroupé par client",
      "Clavier visuel tactile pour la saisie sur tous les champs",
      "Section « À propos » avec les informations du développeur",
      "Sauvegarde automatique des données (quotidienne, hebdomadaire, mensuelle) avec historique",
      "Nouvelle section « Mises à jour » garantissant la conservation des données"
    ]
  },
  {
    version: "1.0.0",
    date: "2026-08-14",
    changes: [
      "Première version du logiciel",
      "Gestion des produits et du stock",
      "Gestion des clients et fournisseurs",
      "Gestion des achats avec mise à jour automatique du stock",
      "Gestion des ventes avec génération automatique de facture",
      "Impression des factures",
      "Tableau de bord et paramètres de l'entreprise"
    ]
  }
];
const DB_NAME = "gestionCommercialeDB";
const DB_VERSION = 3;
let db;

const STORES = ["produits","tiers","achats","ventes","parametres","users","handles"];

function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open(DB_NAME, DB_VERSION);
    req.onupgradeneeded = (e)=>{
      const _db = e.target.result;
      STORES.forEach(s=>{
        if(!_db.objectStoreNames.contains(s)){
          _db.createObjectStore(s, {keyPath:"id"});
        }
      });
    };
    req.onsuccess = ()=>{ db = req.result; resolve(); };
    req.onerror = ()=> reject(req.error);
  });
}

function txStore(name, mode="readonly"){
  return db.transaction(name, mode).objectStore(name);
}
function getAll(store){
  return new Promise((resolve,reject)=>{
    const req = txStore(store).getAll();
    req.onsuccess = ()=> resolve(req.result);
    req.onerror = ()=> reject(req.error);
  });
}
function put(store, obj){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,"readwrite").put(obj);
    req.onsuccess = ()=> resolve(obj);
    req.onerror = ()=> reject(req.error);
  });
}
function del(store, id){
  return new Promise((resolve,reject)=>{
    const req = txStore(store,"readwrite").delete(id);
    req.onsuccess = ()=> resolve();
    req.onerror = ()=> reject(req.error);
  });
}

function uid(prefix){
  return prefix + "_" + Date.now().toString(36) + Math.random().toString(36).slice(2,7);
}
function fmtMoney(n){
  return (Number(n)||0).toLocaleString("fr-FR",{minimumFractionDigits:0,maximumFractionDigits:0}) + " FCFA";
}
function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("fr-FR",{day:"2-digit",month:"2-digit",year:"numeric"});
}
function todayISO(){ return new Date().toISOString(); }

/* ---------------- STATE ---------------- */
let STATE = {
  produits: [],
  tiers: [],
  achats: [],
  ventes: [],
  params: {
    id:"company",
    nom:"ETS Ibrahim Hamissou (IH)",
    adresse:"Dakoro, Maradi",
    telephone:"+227 96375760 / 89151781 ",
    email:"contact@monentreprise.ne",
    nif:"125375/P",
    devise:"FCFA",
    clavierVisuel:true,
    sauvegardeAuto:{ active:false, frequence:"semaine", derniere:null }
  }
};
let currentView = "dashboard";
let currentFactureId = null;

/* ---------------- TOAST ---------------- */
let toastTimer;
function toast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg;
  t.classList.add("show");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove("show"), 2400);
}

/* ---------------- NAV ---------------- */
const NAV_ITEMS = [
  {id:"dashboard", label:"Tableau de bord", ic:"◆"},
  {id:"produits", label:"Produits & stock", ic:"▣"},
  {id:"tiers", label:"Clients & fournisseurs", ic:"◐"},
  {id:"achats", label:"Achats", ic:"↓"},
  {id:"ventes", label:"Ventes", ic:"↑"},
  {id:"factures", label:"Factures", ic:"▤"},
  {id:"parametres", label:"Paramètres", ic:"⚙"},
  {id:"maj", label:"Mises à jour", ic:"↻"},
  {id:"apropos", label:"À propos", ic:"ⓘ"},
];

function renderNav(){
  const nav = document.getElementById("navList");
  nav.innerHTML = "";
  NAV_ITEMS.forEach(it=>{
    const b = document.createElement("button");
    b.className = "nav-btn" + (currentView===it.id ? " active":"");
    b.innerHTML = `<span class="ic">${it.ic}</span> ${it.label}`;
    b.onclick = ()=>{ currentView = it.id; render(); };
    nav.appendChild(b);
  });
}

/* ---------------- MODAL HELPERS ---------------- */
function openModal(html, wide=false){
  document.getElementById("modalBox").className = "modal" + (wide?" wide":"");
  document.getElementById("modalBox").innerHTML = html;
  document.getElementById("overlay").classList.add("open");
}
function closeModal(){
  document.getElementById("overlay").classList.remove("open");
  if(typeof vkClose === "function") vkClose();
}
document.getElementById("overlay").addEventListener("click",(e)=>{
  if(e.target.id==="overlay") closeModal();
});

/* ============================================================
   RENDER ROOT
   ============================================================ */
function render(){
  renderNav();
  const main = document.getElementById("main");
  if(currentView==="dashboard") return renderDashboard(main);
  if(currentView==="produits") return renderProduits(main);
  if(currentView==="tiers") return renderTiers(main);
  if(currentView==="achats") return renderAchats(main);
  if(currentView==="ventes") return renderVentes(main);
  if(currentView==="factures") return renderFactures(main);
  if(currentView==="parametres") return renderParametres(main);
  if(currentView==="apropos") return renderApropos(main);
  if(currentView==="maj") return renderMisesAJour(main);
}

/* ============================================================
   DASHBOARD
   ============================================================ */
function renderDashboard(main){
  const nbProduits = STATE.produits.length;
  const stockFaible = STATE.produits.filter(p=> Number(p.stock) <= Number(p.seuil||0)).length;
  const caVentes = STATE.ventes.reduce((s,v)=> s+Number(v.total||0),0);
  const totalAchats = STATE.achats.reduce((s,a)=> s+Number(a.total||0),0);

  const dernieresVentes = [...STATE.ventes].sort((a,b)=> new Date(b.date)-new Date(a.date)).slice(0,6);

  main.innerHTML = `
    <div class="topbar">
      <div><h1>Tableau de bord</h1><p>Vue d'ensemble de votre activité commerciale</p></div>
    </div>
    <div class="grid-stats">
      <div class="stat-card"><div class="lbl">Produits en stock</div><div class="val">${nbProduits}</div><div class="sub">références actives</div></div>
      <div class="stat-card ${stockFaible>0?'alert':''}"><div class="lbl">Stock faible</div><div class="val">${stockFaible}</div><div class="sub">produit(s) sous le seuil</div></div>
      <div class="stat-card good"><div class="lbl">Chiffre d'affaires</div><div class="val">${fmtMoney(caVentes)}</div><div class="sub">total des ventes</div></div>
      <div class="stat-card"><div class="lbl">Total achats</div><div class="val">${fmtMoney(totalAchats)}</div><div class="sub">total dépensé fournisseurs</div></div>
    </div>

    <div class="panel">
      <h3>Dernières ventes</h3>
      ${dernieresVentes.length ? `
      <table>
        <thead><tr><th>N° Facture</th><th>Date</th><th>Client</th><th class="right">Total</th></tr></thead>
        <tbody>
          ${dernieresVentes.map(v=>`
            <tr>
              <td class="mono">${v.numero}</td>
              <td>${fmtDate(v.date)}</td>
              <td>${tierNom(v.clientId)}</td>
              <td class="right">${fmtMoney(v.total)}</td>
            </tr>`).join("")}
        </tbody>
      </table>` : `<div class="empty">Aucune vente enregistrée pour le moment.</div>`}
    </div>
  `;
}

/* ============================================================
   PRODUITS
   ============================================================ */
function renderProduits(main){
  main.innerHTML = `
    <div class="topbar">
      <div><h1>Produits & stock</h1><p>Gérez votre catalogue et suivez vos niveaux de stock</p></div>
      <button class="btn btn-primary" onclick="openProduitForm()">+ Nouveau produit</button>
    </div>
    <div class="panel">
      ${STATE.produits.length ? `
      <table>
        <thead><tr><th>Référence</th><th>Nom</th><th class="right">Prix achat</th><th class="right">Prix vente</th><th class="right">Stock</th><th></th><th></th></tr></thead>
        <tbody>
          ${STATE.produits.map(p=>{
            const low = Number(p.stock) <= Number(p.seuil||0);
            return `<tr>
              <td class="mono">${p.reference||"—"}</td>
              <td>${p.nom}</td>
              <td class="right">${fmtMoney(p.prixAchat)}</td>
              <td class="right">${fmtMoney(p.prixVente)}</td>
              <td class="right"><span class="tag ${low?'tag-low':'tag-ok'}">${p.stock} ${p.unite||''}</span></td>
              <td><button class="btn btn-outline btn-sm" onclick="openProduitForm('${p.id}')">Modifier</button></td>
              <td><button class="btn btn-danger btn-sm" onclick="deleteProduit('${p.id}')">Suppr.</button></td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>` : `<div class="empty">Aucun produit. Cliquez sur « + Nouveau produit » pour commencer.</div>`}
    </div>
  `;
}

function openProduitForm(id){
  const p = id ? STATE.produits.find(x=>x.id===id) : {nom:"",reference:"",prixAchat:0,prixVente:0,stock:0,seuil:0,unite:"pcs"};
  openModal(`
    <h3>${id?"Modifier le produit":"Nouveau produit"}</h3>
    <div class="field"><label>Nom du produit</label><input id="f_nom" value="${p.nom||''}" placeholder="Ex: Sac de riz 25kg"></div>
    <div class="field-row">
      <div class="field"><label>Référence</label><input id="f_ref" value="${p.reference||''}" placeholder="REF-001"></div>
      <div class="field"><label>Unité</label><input id="f_unite" value="${p.unite||'pcs'}" placeholder="pcs, kg, sac..."></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Prix d'achat (FCFA)</label><input id="f_pa" type="number" value="${p.prixAchat||0}"></div>
      <div class="field"><label>Prix de vente (FCFA)</label><input id="f_pv" type="number" value="${p.prixVente||0}"></div>
    </div>
    <div class="field-row">
      <div class="field"><label>Stock actuel</label><input id="f_stock" type="number" value="${p.stock||0}"></div>
      <div class="field"><label>Seuil d'alerte</label><input id="f_seuil" type="number" value="${p.seuil||0}"></div>
    </div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>
      <button class="btn btn-primary" onclick="saveProduit('${id||''}')">Enregistrer</button>
    </div>
  `);
}

async function saveProduit(id){
  const obj = {
    id: id || uid("prod"),
    nom: document.getElementById("f_nom").value.trim(),
    reference: document.getElementById("f_ref").value.trim(),
    unite: document.getElementById("f_unite").value.trim(),
    prixAchat: Number(document.getElementById("f_pa").value)||0,
    prixVente: Number(document.getElementById("f_pv").value)||0,
    stock: Number(document.getElementById("f_stock").value)||0,
    seuil: Number(document.getElementById("f_seuil").value)||0,
  };
  if(!obj.nom){ toast("Le nom du produit est requis"); return; }
  await put("produits", obj);
  STATE.produits = await getAll("produits");
  closeModal(); toast("Produit enregistré"); render();
}
async function deleteProduit(id){
  if(!confirm("Supprimer ce produit ?")) return;
  await del("produits", id);
  STATE.produits = await getAll("produits");
  toast("Produit supprimé"); render();
}

/* ============================================================
   TIERS (clients / fournisseurs)
   ============================================================ */
function tierNom(id){
  const t = STATE.tiers.find(x=>x.id===id);
  return t ? t.nom : "—";
}
function renderTiers(main){
  main.innerHTML = `
    <div class="topbar">
      <div><h1>Clients & fournisseurs</h1><p>Votre carnet d'adresses commerciales</p></div>
      <button class="btn btn-primary" onclick="openTierForm()">+ Nouveau contact</button>
    </div>
    <div class="panel">
      ${STATE.tiers.length ? `
      <table>
        <thead><tr><th>Nom</th><th>Type</th><th>Téléphone</th><th>Adresse</th><th></th><th></th></tr></thead>
        <tbody>
          ${STATE.tiers.map(t=>`
            <tr>
              <td>${t.nom}</td>
              <td><span class="tag ${t.type==='client'?'tag-client':'tag-fournisseur'}">${t.type==='client'?'Client':'Fournisseur'}</span></td>
              <td class="mono">${t.telephone||"—"}</td>
              <td>${t.adresse||"—"}</td>
              <td><button class="btn btn-outline btn-sm" onclick="openTierForm('${t.id}')">Modifier</button></td>
              <td><button class="btn btn-danger btn-sm" onclick="deleteTier('${t.id}')">Suppr.</button></td>
            </tr>`).join("")}
        </tbody>
      </table>` : `<div class="empty">Aucun contact enregistré.</div>`}
    </div>
  `;
}
function openTierForm(id){
  const t = id ? STATE.tiers.find(x=>x.id===id) : {nom:"",type:"client",telephone:"",adresse:""};
  openModal(`
    <h3>${id?"Modifier le contact":"Nouveau contact"}</h3>
    <div class="field"><label>Nom</label><input id="t_nom" value="${t.nom||''}" placeholder="Nom du client / fournisseur"></div>
    <div class="field"><label>Type</label>
      <select id="t_type">
        <option value="client" ${t.type==='client'?'selected':''}>Client</option>
        <option value="fournisseur" ${t.type==='fournisseur'?'selected':''}>Fournisseur</option>
      </select>
    </div>
    <div class="field"><label>Téléphone</label><input id="t_tel" value="${t.telephone||''}"></div>
    <div class="field"><label>Adresse</label><input id="t_adr" value="${t.adresse||''}"></div>
    <div class="modal-actions">
      <button class="btn btn-outline" onclick="closeModal()">Annuler</button>

function renderLinesEditor(priceField, searchable){

/* ---------------- recherche produit (section ventes) ---------------- */
function onProductSearchInput(priceField){
  window.__priceField = priceField;
  const input = document.getElementById("prodSearchInput");
  const box = document.getElementById("prodSearchResults");
  const q = input.value.trim().toLowerCase();

  let matches = STATE.produits;
  if(q){
    matches = STATE.produits.filter(p =>
      (p.nom||"").toLowerCase().includes(q) || (p.reference||"").toLowerCase().includes(q)
    );
  }
  matches = matches.slice(0, 8);

  if(matches.length === 0){
    box.innerHTML = `<div class="prod-search-empty">Aucun produit trouvé.</div>`;
  } else {
    box.innerHTML = matches.map(p => `
      <div class="prod-search-item" onmousedown="event.preventDefault(); selectSearchedProduct('${p.id}','${priceField}')">
        <div>
          <div class="psi-name">${p.nom}</div>
          <div class="psi-meta">${p.reference? p.reference+" · ":""}Stock: ${p.stock} ${p.unite||''}</div>
        </div>
        <div class="psi-price">${fmtMoney(p[priceField])}</div>
      </div>
    `).join("");
  }
  box.classList.remove("hidden");
}
function selectSearchedProduct(produitId, priceField){
  const p = STATE.produits.find(x=>x.id===produitId);
  if(!p) return;

  const existing = currentLines.find(l=>l.produitId===produitId);
  if(existing){
    existing.qte = Number(existing.qte||0) + 1;
  } else {
    const emptyLine = currentLines.find(l=>!l.produitId);
    if(emptyLine){
      emptyLine.produitId = produitId;
      emptyLine.qte = emptyLine.qte || 1;
      emptyLine.prixUnitaire = p[priceField];
    } else {
      currentLines.push({produitId, qte:1, prixUnitaire:p[priceField]});
    }
  }
  refreshLinesBox(priceField, true);
  toast(`${p.nom} ajouté`);
}

function addLine(priceField){
  currentLines.push({produitId:"", qte:1, prixUnitaire:0});
  refreshLinesBox(priceField, !!document.getElementById("prodSearchInput"));
}
function removeLine(idx){
  currentLines.splice(idx,1);
  refreshLinesBox(window.__priceField, !!document.getElementById("prodSearchInput"));
}
function updateLine(idx, key, val){
  currentLines[idx][key] = (key==='qte'||key==='prixUnitaire') ? Number(val) : val;
  if(key==='produitId'){
    const p = STATE.produits.find(x=>x.id===val);
    if(p) currentLines[idx].prixUnitaire = p[window.__priceField];
  }
  refreshLinesBox(window.__priceField, !!document.getElementById("prodSearchInput"));
}
function refreshLinesBox(priceField, searchable){
  window.__priceField = priceField;
  const searchVal = document.getElementById("prodSearchInput")?.value || "";
  document.getElementById("linesBox").outerHTML = renderLinesEditor(priceField, searchable);
  const newInput = document.getElementById("prodSearchInput");
  if(newInput && searchVal){ newInput.value = searchVal; }
}
document.addEventListener("click", (e)=>{
  const results = document.getElementById("prodSearchResults");
  const input = document.getElementById("prodSearchInput");
  if(results && !results.classList.contains("hidden")){
    if(e.target !== input) results.classList.add("hidden");
  }
});

  const summaries = Object.keys(groups).map(cid=>{
    const ventes = [...groups[cid]].sort((a,b)=> new Date(b.date)-new Date(a.date));

            const badge = solde < 0 ? `<span class="tag tag-low">Reste ${fmtMoney(-solde)}</span>` : `<span class="tag tag-ok">Soldé</span>`;
            return `<tr>
              <td class="mono">${v.numero}</td>

async function saveVente(){
  const lignes = currentLines.filter(l=>l.produitId && Number(l.qte)>0);
  if(lignes.length===0){ toast("Ajoutez au moins une ligne valide"); return; }

  for(const l of lignes){
    const p = STATE.produits.find(x=>x.id===l.produitId);
    if(p && Number(l.qte) > Number(p.stock)){
      toast(`Stock insuffisant pour "${p.nom}" (disponible: ${p.stock})`);
      return;
    }
  }

  const total = lignes.reduce((s,l)=> s + Number(l.qte)*Number(l.prixUnitaire), 0);
  const nextNum = "FAC-" + String(STATE.ventes.length+1).padStart(4,"0");
  const payeInput = document.getElementById("v_paye").value;
  const montantPaye = payeInput === "" ? total : Number(payeInput);
  const obj = {
    id: uid("vente"),
    numero: nextNum,
    date: document.getElementById("v_date").value || todayISO(),
    clientId: document.getElementById("v_client").value,
    lignes, total, montantPaye
  };
  await put("ventes", obj);
  for(const l of lignes){
    const p = STATE.produits.find(x=>x.id===l.produitId);
    if(p){ p.stock = Number(p.stock||0) - Number(l.qte); await put("produits", p); }
  }
  STATE.ventes = await getAll("ventes");
  STATE.produits = await getAll("produits");
  closeModal();
  toast("Vente enregistrée, facture générée");
  viewFacture(obj.id);
}

function calcReste(total, paye){
  const diff = Number(paye||0) - Number(total||0);
  if(diff >= 0) return {label:"Montant à restituer (monnaie)", val:diff, cls:"ok"};
  return {label:"Reste à payer", val:-diff, cls:"due"};
}

function updateFacturePaiement(venteId, persist){
  const v = STATE.ventes.find(x=>x.id===venteId);
  const input = document.getElementById("fac_paye");
  const paye = Number(input.value)||0;
  const r = calcReste(v.total, paye);
  const row = document.getElementById("fac_reste_row");
  row.className = row.className.replace(/\bok\b|\bdue\b/g,"").trim() + " " + r.cls;
  row.querySelector(".r-label").textContent = r.label;
  row.querySelector(".r-val").textContent = fmtMoney(r.val);
  const payePrint = document.getElementById("fac_paye_print");
  if(payePrint) payePrint.textContent = fmtMoney(paye);
  if(persist){
    v.montantPaye = paye;
    put("ventes", v).then(()=> toast("Paiement mis à jour"));
  }
}

function printFacture(){
  let styleEl = document.getElementById("dynPageStyle");
  if(!styleEl){ styleEl = document.createElement("style"); styleEl.id="dynPageStyle"; document.head.appendChild(styleEl); }
  if(factureFormat === "ticket"){
    styleEl.textContent = `@page{ size: ${ticketWidth}mm auto; margin: 2mm; }`;
  } else if(factureFormat === "a5"){
    styleEl.textContent = `@page{ size: A5; margin: 8mm; }`;

}

function viewFacture(venteId){
  currentFactureId = venteId;
  const v = STATE.ventes.find(x=>x.id===venteId);
  const client = STATE.tiers.find(t=>t.id===v.clientId) || {nom:"Client au comptant"};
  const co = STATE.params;
  const montantPaye = v.montantPaye ?? v.total;
  const reste = calcReste(v.total, montantPaye);

  document.body.classList.remove(...FACTURE_FORMATS.map(f=>"print-"+f));
  document.body.classList.add("print-"+factureFormat);

  let inner, viewClass;
  if(factureFormat === "ticket"){
    inner = buildFactureTicket(v, client, co, montantPaye, reste);
    viewClass = "format-ticket";
  } else if(factureFormat === "a5"){
    inner = `<div class="fac-scaled">${buildFactureA4(v, client, co, montantPaye, reste, false)}</div>`;
    viewClass = "format-a5";
  } else if(factureFormat === "a4double"){
    inner = buildFactureA4Double(v, client, co, montantPaye, reste);
    viewClass = "format-a4double";
  } else {
    inner = buildFactureA4(v, client, co, montantPaye, reste, false);
    viewClass = "format-a4";
  }

  const sharedPayEditor = factureFormat === "a4double" ? `
    <div class="shared-pay-box screen-only">
      <label>Montant payé (appliqué aux deux exemplaires)</label>
      <input type="number" min="0" value="${montantPaye}" onchange="updateSharedPaiement('${v.id}', this.value)">
    </div>` : "";

  const main = document.getElementById("main");
  main.innerHTML = `
    <div class="topbar">
      <div><h1>Facture ${v.numero}</h1><p>Détail de la vente et impression</p></div>
      <button class="btn btn-outline" onclick="currentView='ventes'; render();">← Retour</button>
    </div>

    <div class="format-bar">
      <div class="format-toggle">
        <button class="${factureFormat==='a4'?'active':''}" onclick="setFactureFormat('a4','${v.id}')">📄 A4</button>
        <button class="${factureFormat==='a4double'?'active':''}" onclick="setFactureFormat('a4double','${v.id}')">📑 A4 (Original + Duplicata)</button>
        <button class="${factureFormat==='a5'?'active':''}" onclick="setFactureFormat('a5','${v.id}')">📃 A5</button>
        <button class="${factureFormat==='ticket'?'active':''}" onclick="setFactureFormat('ticket','${v.id}')">🧾 Ticket thermique</button>
      </div>
      ${factureFormat==='ticket' ? `
      <select onchange="setTicketWidth(this.value,'${v.id}')">
        <option value="80" ${ticketWidth==='80'?'selected':''}>Rouleau 80mm</option>
        <option value="58" ${ticketWidth==='58'?'selected':''}>Rouleau 58mm</option>
      </select>` : ``}
    </div>
    ${sharedPayEditor}

    <div id="factureView" class="${viewClass}">
      ${inner}
      <div class="fac-actions">
        <button class="btn btn-danger" onclick="deleteVenteFromFacture('${v.id}')">Supprimer la vente</button>
        <button class="btn btn-outline" onclick="openPreview()">👁 Aperçu avant impression</button>
        <button class="btn btn-primary" onclick="printFacture()">🖨 Imprimer la facture</button>
      </div>
    </div>
  `;
}

function openPreview(){
  const v = STATE.ventes.find(x=>x.id===currentFactureId);
  if(!v) return;
  const client = STATE.tiers.find(t=>t.id===v.clientId) || {nom:"Client au comptant"};
  const co = STATE.params;
  const payeInputEl = document.getElementById("fac_paye") || document.querySelector(".shared-pay-box input");
  const montantPaye = payeInputEl ? (Number(payeInputEl.value)||0) : (v.montantPaye ?? v.total);
  const reste = calcReste(v.total, montantPaye);

  let inner, paperClass;
  if(factureFormat === "ticket"){
    inner = buildFactureTicket(v, client, co, montantPaye, reste);
    paperClass = "paper-ticket";
  } else if(factureFormat === "a5"){
    inner = `<div class="fac-scaled">${buildFactureA4(v, client, co, montantPaye, reste, true)}</div>`;
    paperClass = "paper-a5";
  } else if(factureFormat === "a4double"){
    inner = buildFactureA4Double(v, client, co, montantPaye, reste);
    paperClass = "paper-a4";
  } else {
    inner = buildFactureA4(v, client, co, montantPaye, reste, true);
    paperClass = "paper-a4";
  }

  const paper = document.getElementById("previewPaper");
  paper.className = "preview-paper is-preview " + paperClass;
  paper.innerHTML = inner;
  document.getElementById("previewOverlay").classList.add("open");
}
function closePreview(){
  document.getElementById("previewOverlay").classList.remove("open");
}

  toast("Vente supprimée");
  render();
}

    exportedAt: new Date().toISOString()
  };
  return new Blob([JSON.stringify(data,null,2)], {type:"application/json"});
}

/* ---------------- DOSSIER DE SAUVEGARDE (File System Access API) ---------------- */
let backupDirName = null;   // nom du dossier choisi, mis en cache pour l'affichage synchrone

function backupFolderSupported(){
  return typeof window.showDirectoryPicker === "function";
}

async function loadBackupDirName(){
  if(!backupFolderSupported()) return;
  try{
    const rec = await getAll("handles");
    const item = rec.find(x=>x.id==="dossierSauvegarde");
    backupDirName = item && item.handle ? item.handle.name : null;
  }catch(e){ backupDirName = null; }
}

async function getBackupDirHandle(canPrompt){
  if(!backupFolderSupported()) return null;
  try{
    const rec = await getAll("handles");
    const item = rec.find(x=>x.id==="dossierSauvegarde");
    if(!item || !item.handle) return null;
    let perm = await item.handle.queryPermission({mode:"readwrite"});
    if(perm !== "granted" && canPrompt){
      perm = await item.handle.requestPermission({mode:"readwrite"});
    }
    return perm === "granted" ? item.handle : null;
  }catch(e){ return null; }
}

async function chooseBackupFolder(){
  if(!backupFolderSupported()){
    toast("Votre navigateur ne permet pas de choisir un dossier (utilisez Chrome ou Edge sur ordinateur).");
    return;
  }
  try{
    const handle = await window.showDirectoryPicker({ id:"gestionCommercialeBackup", mode:"readwrite" });
    await put("handles", { id:"dossierSauvegarde", handle });
    backupDirName = handle.name;
    toast(`Dossier de sauvegarde défini : « ${handle.name} »`);
    render();
  }catch(e){
    if(e && e.name !== "AbortError") toast("Impossible de sélectionner ce dossier.");
  }
}
async function clearBackupFolder(){
  await del("handles", "dossierSauvegarde");
  backupDirName = null;
  toast("Dossier de sauvegarde retiré — retour au téléchargement classique");
  render();
}

async function downloadBackupFile(silent){
  const blob = buildBackupBlob();
  const stamp = new Date().toISOString().slice(0,10);
  const filename = `gestionCommerciale-sauvegarde-${stamp}.json`;

  const dirHandle = await getBackupDirHandle(!silent);
  if(dirHandle){
    try{
      const fileHandle = await dirHandle.getFileHandle(filename, { create:true });
      const writable = await fileHandle.createWritable();
      await writable.write(blob);
      await writable.close();
      if(!silent) toast(`Sauvegarde enregistrée dans « ${dirHandle.name} »`);
      return;
    }catch(e){
      // en cas d'échec d'écriture, on bascule sur le téléchargement classique ci-dessous
    }
  }

  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
  if(!silent) toast("Sauvegarde exportée");
}

async function exportData(){
  await downloadBackupFile(false);
}
function importData(evt){
  const file = evt.target.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = async (e)=>{
    try{
      const data = JSON.parse(e.target.result);
      if(!confirm("Cette opération remplacera toutes les données actuelles. Continuer ?")) return;
      for(const store of ["produits","tiers","achats","ventes"]){
        const existing = await getAll(store);
        for(const item of existing) await del(store, item.id);
        for(const item of (data[store]||[])) await put(store, item);
      }
      if(data.parametres) await put("parametres", data.parametres);
      await loadAll();
      toast("Données restaurées avec succès");
      render();
    }catch(err){
      toast("Fichier de sauvegarde invalide");
    }
  };
  reader.readAsText(file);
}

/* ---------------- SAUVEGARDE AUTOMATIQUE ---------------- */
const BACKUP_INTERVALS_MS = {
  jour: 24*60*60*1000,
  semaine: 7*24*60*60*1000,
  mois: 30*24*60*60*1000
};

async function toggleSauvegardeAuto(checked){
  STATE.params.sauvegardeAuto = STATE.params.sauvegardeAuto || { frequence:"semaine", derniere:null };
  STATE.params.sauvegardeAuto.active = checked;
  await put("parametres", STATE.params);
  toast(checked ? "Sauvegarde automatique activée" : "Sauvegarde automatique désactivée");
  render();
  if(checked) checkAutoBackup();
}
async function setSauvegardeFrequence(freq){
  STATE.params.sauvegardeAuto = STATE.params.sauvegardeAuto || { active:false, derniere:null };
  STATE.params.sauvegardeAuto.frequence = freq;
  await put("parametres", STATE.params);
  toast("Fréquence de sauvegarde mise à jour");
  checkAutoBackup();
}
function addBackupHistoryEntry(type){
  STATE.params.sauvegardeAuto = STATE.params.sauvegardeAuto || { active:false, frequence:"semaine", derniere:null, historique:[] };
  const historique = STATE.params.sauvegardeAuto.historique || [];
  historique.push({ date: new Date().toISOString(), type });
  STATE.params.sauvegardeAuto.historique = historique.slice(-20); // garde les 20 dernières entrées
}

async function checkAutoBackup(){
  const sa = STATE.params.sauvegardeAuto;
  if(!sa || !sa.active) return;
  const interval = BACKUP_INTERVALS_MS[sa.frequence] || BACKUP_INTERVALS_MS.semaine;
  const last = sa.derniere ? new Date(sa.derniere).getTime() : 0;
  const due = (Date.now() - last) >= interval;
  if(due){
    await downloadBackupFile(true);
    STATE.params.sauvegardeAuto.derniere = new Date().toISOString();
    addBackupHistoryEntry("auto");
    await put("parametres", STATE.params);
    toast("💾 Sauvegarde automatique effectuée");
    if(currentView === "parametres") render();
  }
}
async function forceBackupNow(){
  await downloadBackupFile(false);
  STATE.params.sauvegardeAuto = STATE.params.sauvegardeAuto || { active:false, frequence:"semaine", derniere:null };
  STATE.params.sauvegardeAuto.derniere = new Date().toISOString();
  addBackupHistoryEntry("manuel");
  await put("parametres", STATE.params);
  toast("💾 Sauvegarde effectuée");
  render();
}
function startAutoBackupScheduler(){
  checkAutoBackup();
  setInterval(checkAutoBackup, 60*60*1000); // vérifie toutes les heures
}

/* ============================================================
   CLAVIER VISUEL
   ============================================================ */
let vkActiveEl = null;
let vkShift = false;

function vkIsEligible(el){
  if(!el || !el.tagName) return false;
  const tag = el.tagName;
  if(tag !== "INPUT" && tag !== "TEXTAREA") return false;
  if(el.readOnly || el.disabled) return false;
  const type = (el.type || "text").toLowerCase();
  const excluded = ["date","file","checkbox","radio","range","color","hidden","submit","button"];
  if(excluded.includes(type)) return false;
  return true;
}

function vkKeyHtml(ch, extraClass){
  return `<button type="button" class="vk-key ${extraClass||''}" data-ch="${ch}">${ch}</button>`;
}

function vkRenderLayout(){
  const kb = document.getElementById("virtualKeyboard");
  const numeric = vkActiveEl && (vkActiveEl.type||"text").toLowerCase() === "number";

  if(numeric){
    kb.innerHTML = `
      <div class="vk-topbar"><span>Clavier numérique</span><button class="vk-close" data-action="close">Fermer ✕</button></div>
      <div class="vk-row">${["7","8","9"].map(n=>vkKeyHtml(n)).join("")}</div>
      <div class="vk-row">${["4","5","6"].map(n=>vkKeyHtml(n)).join("")}</div>
      <div class="vk-row">${["1","2","3"].map(n=>vkKeyHtml(n)).join("")}</div>
      <div class="vk-row">
        ${vkKeyHtml("-","special")}
        ${vkKeyHtml("0")}
        ${vkKeyHtml(".","special")}
      </div>
      <div class="vk-row">
        <button type="button" class="vk-key wide special" data-action="clear">Effacer tout</button>
        <button type="button" class="vk-key wide special" data-action="backspace">⌫</button>
        <button type="button" class="vk-key wide" data-action="enter">OK ✓</button>
      </div>
    `;
    return;
  }

  const rowsLower = [
    ["1","2","3","4","5","6","7","8","9","0"],
    ["a","z","e","r","t","y","u","i","o","p"],
    ["q","s","d","f","g","h","j","k","l","m"],
    ["w","x","c","v","b","n","é","è"],
  ];
  const rows = vkShift ? rowsLower.map(r=> r.map(c=> /[a-z]/.test(c) ? c.toUpperCase() : c)) : rowsLower;

  kb.innerHTML = `
    <div class="vk-topbar">
      <span>Clavier visuel</span>
      <button class="vk-close" data-action="close">Fermer ✕</button>
    </div>
    <div class="vk-row">${rows[0].map(c=>vkKeyHtml(c)).join("")}</div>
    <div class="vk-row">${rows[1].map(c=>vkKeyHtml(c)).join("")}</div>
    <div class="vk-row">${rows[2].map(c=>vkKeyHtml(c)).join("")}</div>
    <div class="vk-row">
      <button type="button" class="vk-key wide special ${vkShift?'shift-active':''}" data-action="shift">⇧ Maj</button>
      ${rows[3].map(c=>vkKeyHtml(c)).join("")}
      <button type="button" class="vk-key wide special" data-action="backspace">⌫</button>
    </div>
    <div class="vk-row">
      ${vkKeyHtml("@","special")}
      ${vkKeyHtml(".","special")}
      <button type="button" class="vk-key space" data-action="space">Espace</button>
      ${vkKeyHtml(",","special")}
      ${vkKeyHtml("-","special")}
      <button type="button" class="vk-key wide" data-action="enter">OK ✓</button>
    </div>
  `;
}

function vkOpen(el){
  vkActiveEl = el;
  vkShift = false;
  vkRenderLayout();
  document.getElementById("virtualKeyboard").classList.add("open");
  document.body.classList.add("vk-open");
  setTimeout(()=> el.scrollIntoView({block:"center", behavior:"smooth"}), 120);
}
function vkClose(){
  document.getElementById("virtualKeyboard").classList.remove("open");
  document.body.classList.remove("vk-open");
  vkActiveEl = null;
}

function vkInsertChar(ch){
  const el = vkActiveEl;
  if(!el) return;
  const start = el.selectionStart ?? el.value.length;
  const end = el.selectionEnd ?? el.value.length;
  const val = el.value;
  el.value = val.slice(0,start) + ch + val.slice(end);
  const pos = start + ch.length;
  el.setSelectionRange(pos,pos);
  el.dispatchEvent(new Event("input", {bubbles:true}));
}
function vkBackspace(){
  const el = vkActiveEl;
  if(!el) return;
  const start = el.selectionStart ?? el.value.length;
  const end = el.selectionEnd ?? el.value.length;
  const val = el.value;
  if(start === end){
    if(start === 0) return;
    el.value = val.slice(0,start-1) + val.slice(end);
    el.setSelectionRange(start-1,start-1);
  } else {
    el.value = val.slice(0,start) + val.slice(end);
    el.setSelectionRange(start,start);
  }
  el.dispatchEvent(new Event("input", {bubbles:true}));
}
function vkClear(){
  const el = vkActiveEl;
  if(!el) return;
  el.value = "";
  el.dispatchEvent(new Event("input", {bubbles:true}));
  el.focus();
}
function vkSpace(){ vkInsertChar(" "); }
function vkEnter(){
  const el = vkActiveEl;
  if(el) el.dispatchEvent(new Event("change", {bubbles:true}));
  vkClose();
  if(el) el.blur();
}
function vkToggleShift(){
  vkShift = !vkShift;
  vkRenderLayout();
}

(function initVirtualKeyboard(){
  const kb = document.getElementById("virtualKeyboard");
  kb.addEventListener("mousedown", (e)=> e.preventDefault());
  kb.addEventListener("click", (e)=>{
    const btn = e.target.closest("button");
    if(!btn) return;
    const action = btn.dataset.action;
    if(action === "backspace") vkBackspace();
    else if(action === "space") vkSpace();
    else if(action === "shift") vkToggleShift();
    else if(action === "clear") vkClear();
    else if(action === "enter") vkEnter();
    else if(action === "close") vkClose();
    else if(btn.dataset.ch !== undefined) vkInsertChar(btn.dataset.ch);
  });

  document.addEventListener("focusin", (e)=>{
    if(STATE.params && STATE.params.clavierVisuel === false) return;
    if(vkIsEligible(e.target)) vkOpen(e.target);
  });
  document.addEventListener("focusout", ()=>{
    setTimeout(()=>{
      if(!vkIsEligible(document.activeElement)) vkClose();
    }, 60);
  });
})();

/* ============================================================
   AUTHENTIFICATION
   ============================================================ */
let CURRENT_USER = null;

function genSalt(){
  const arr = new Uint8Array(16);
  crypto.getRandomValues(arr);
  return Array.from(arr).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function sha256Hex(text){
  const enc = new TextEncoder().encode(text);
  const buf = await crypto.subtle.digest("SHA-256", enc);
  return Array.from(new Uint8Array(buf)).map(b=>b.toString(16).padStart(2,"0")).join("");
}
async function hashPassword(password, salt){
  return sha256Hex(salt + "::" + password);
}
function initials(name){
  return (name||"?").trim().split(/\s+/).slice(0,2).map(w=>w[0]?.toUpperCase()||"").join("") || "?";
}
function togglePw(inputId, btn){
  const input = document.getElementById(inputId);
  const show = input.type === "password";
  input.type = show ? "text" : "password";
  btn.textContent = show ? "Masquer" : "Afficher";
}

async function checkAuthAndStart(){
  const users = await getAll("users");
  if(users.length === 0){
    renderSetupScreen();
  } else {
    renderLoginScreen();
  }
}

function renderSetupScreen(error){
  document.getElementById("app").classList.add("hidden");
  document.getElementById("authScreen").innerHTML = `
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo">IH</div>
        <h1>Gestion ETS Ibrahim Hamissou (IH) </h1>
        <p>Configuration initiale de votre logiciel</p>
      </div>
      <div class="auth-tabnote">Première utilisation — créez le compte administrateur</div>
      <div class="auth-error ${error?'show':''}">${error||''}</div>
      <div class="field"><label>Nom complet</label><input id="su_name" placeholder="Ex: Saminou Mahaman Chapiou"></div>
      <div class="field"><label>Nom d'utilisateur</label><input id="su_user" placeholder="Ex: admin" autocomplete="username"></div>
      <div class="field">
        <label>Mot de passe</label>
        <div class="pw-wrap">
          <input id="su_pw" type="password" placeholder="Au moins 4 caractères" autocomplete="new-password">
          <button type="button" class="pw-toggle" onclick="togglePw('su_pw', this)">Afficher</button>
        </div>
      </div>
      <div class="field">
        <label>Confirmer le mot de passe</label>
        <div class="pw-wrap">
          <input id="su_pw2" type="password" placeholder="Retapez le mot de passe" autocomplete="new-password">
          <button type="button" class="pw-toggle" onclick="togglePw('su_pw2', this)">Afficher</button>
        </div>
      </div>
      <button class="btn btn-primary" onclick="handleSetupSubmit()">Créer le compte et démarrer</button>
    </div>
  `;
  document.getElementById("authScreen").classList.remove("hidden");
}

async function handleSetupSubmit(){
  const name = document.getElementById("su_name").value.trim();
  const username = document.getElementById("su_user").value.trim().toLowerCase();
  const pw = document.getElementById("su_pw").value;
  const pw2 = document.getElementById("su_pw2").value;

  if(!name || !username){ renderSetupScreen("Veuillez renseigner le nom et le nom d'utilisateur."); return; }
  if(pw.length < 4){ renderSetupScreen("Le mot de passe doit contenir au moins 4 caractères."); return; }
  if(pw !== pw2){ renderSetupScreen("Les deux mots de passe ne correspondent pas."); return; }

  const salt = genSalt();
  const hash = await hashPassword(pw, salt);
  const user = { id: uid("user"), nom:name, username, salt, hash, createdAt: todayISO() };
  await put("users", user);
  toast("Compte créé avec succès");
  await startApp(user);
}

function renderLoginScreen(error){
  document.getElementById("app").classList.add("hidden");
  document.getElementById("authScreen").innerHTML = `
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo"> IH </div>
        <h1>Gestion ETS Ibrahim Hamissou (IH) </h1>
        <p>Connectez-vous pour accéder à votre logiciel</p>
      </div>
      <div class="auth-error ${error?'show':''}">${error||''}</div>
      <div class="field"><label>Nom d'utilisateur</label><input id="li_user" placeholder="Nom d'utilisateur" autocomplete="username" onkeydown="if(event.key==='Enter')handleLoginSubmit()"></div>
      <div class="field">
        <label>Mot de passe</label>
        <div class="pw-wrap">
          <input id="li_pw" type="password" placeholder="Mot de passe" autocomplete="current-password" onkeydown="if(event.key==='Enter')handleLoginSubmit()">
          <button type="button" class="pw-toggle" onclick="togglePw('li_pw', this)">Afficher</button>
        </div>
      </div>
      <button class="btn btn-primary" onclick="handleLoginSubmit()">Se connecter</button>
      <div class="auth-switch">Mot de passe oublié ? Contactez l'administrateur du poste, ou réinitialisez via « Exporter/Importer » les données si nécessaire.</div>
    </div>
  `;
  document.getElementById("authScreen").classList.remove("hidden");
  setTimeout(()=> document.getElementById("li_user")?.focus(), 50);
}

async function handleLoginSubmit(){
  const username = document.getElementById("li_user").value.trim().toLowerCase();
  const pw = document.getElementById("li_pw").value;
  if(!username || !pw){ renderLoginScreen("Veuillez renseigner vos identifiants."); return; }

  const users = await getAll("users");
  const user = users.find(u=>u.username===username);
  if(!user){ renderLoginScreen("Identifiants incorrects."); return; }

  const hash = await hashPassword(pw, user.salt);
  if(hash !== user.hash){ renderLoginScreen("Identifiants incorrects."); return; }

  await startApp(user);
}

async function startApp(user){
  CURRENT_USER = user;
  document.getElementById("authScreen").classList.add("hidden");
  document.getElementById("authScreen").innerHTML = "";
  document.getElementById("app").classList.remove("hidden");
  document.getElementById("userName").textContent = user.nom || user.username;
  document.getElementById("userAvatar").textContent = initials(user.nom || user.username);
  currentView = "dashboard";
  render();
  if(!window.__autoBackupStarted){
    window.__autoBackupStarted = true;
    startAutoBackupScheduler();
  }
  if(window.__justUpdated){
    const info = window.__justUpdated;
    window.__justUpdated = null;
    setTimeout(()=> toast(`✅ Mise à jour vers la version ${info.to} — toutes vos données ont été conservées.`), 400);
  }
}

function logout(){
  CURRENT_USER = null;
  document.getElementById("app").classList.add("hidden");
  renderLoginScreen();
}

async function changePassword(){
  const cur = document.getElementById("pw_current").value;
  const next = document.getElementById("pw_new").value;
  const next2 = document.getElementById("pw_new2").value;
  const msgEl = document.getElementById("pwMsg");
  msgEl.classList.remove("show"); msgEl.textContent = "";

  const curHash = await hashPassword(cur, CURRENT_USER.salt);
  if(curHash !== CURRENT_USER.hash){ msgEl.textContent="Mot de passe actuel incorrect."; msgEl.classList.add("show"); return; }
  if(next.length < 4){ msgEl.textContent="Le nouveau mot de passe doit contenir au moins 4 caractères."; msgEl.classList.add("show"); return; }
  if(next !== next2){ msgEl.textContent="Les deux nouveaux mots de passe ne correspondent pas."; msgEl.classList.add("show"); return; }

  const newSalt = genSalt();
  CURRENT_USER.salt = newSalt;
  CURRENT_USER.hash = await hashPassword(next, newSalt);
  await put("users", CURRENT_USER);
  document.getElementById("pw_current").value = "";
  document.getElementById("pw_new").value = "";
  document.getElementById("pw_new2").value = "";
  toast("Mot de passe mis à jour");
}

/* ============================================================
   INIT
   ============================================================ */
async function loadAll(){
  STATE.produits = await getAll("produits");
  STATE.tiers = await getAll("tiers");
  STATE.achats = await getAll("achats");
  STATE.ventes = await getAll("ventes");
  const params = await getAll("parametres");
  if(params.length) STATE.params = params[0];
  else await put("parametres", STATE.params);
}

async function checkVersionUpdate(){
  const installed = STATE.params.derniereVersionInstallee;
  if(installed === APP_VERSION) return;

  const hasData = (STATE.produits.length + STATE.tiers.length + STATE.achats.length + STATE.ventes.length) > 0;

  if(!installed && !hasData){
    // toute première installation : rien à préserver, on enregistre simplement la version
    STATE.params.derniereVersionInstallee = APP_VERSION;
    STATE.params.derniereVersionInstalleeLe = new Date().toISOString();
    await put("parametres", STATE.params);
    return;
  }

  // une mise à jour est détectée : on sécurise les données existantes avant de continuer
  await downloadBackupFile(true);
  addBackupHistoryEntry("maj");
  STATE.params.derniereVersionInstallee = APP_VERSION;
  STATE.params.derniereVersionInstalleeLe = new Date().toISOString();
  await put("parametres", STATE.params);
  window.__justUpdated = { from: installed || "version antérieure", to: APP_VERSION };
}

(async function init(){
  await openDB();
  await loadAll();
  await loadBackupDirName();
  await checkVersionUpdate();
  await checkAuthAndStart();
})();
